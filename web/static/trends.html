<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Google 趋势词雷达</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/assets/tiktok.css" />
  <link rel="stylesheet" href="/assets/trends.css" />
</head>
<body class="page-trends">
  <div class="noise" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b gt-orb" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="mark gt-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">Google 趋势词雷达</p>
        <p class="brand-sub">多地区热搜 · AI 相关过滤</p>
      </div>
    </div>
        <nav class="nav">
      <a href="/">模型新词</a>
      <a href="/tiktok">TikTok 热词</a>
      <a class="active" href="/trends">谷歌趋势</a>
      <a href="/reddit">Reddit</a>
      <a href="/toolify">Toolify</a>
    </nav>
    <div class="meta">
      <span class="pill" id="scanAt">—</span>
      <button type="button" class="btn" id="btnScan">重新扫描</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>谷歌正在<br /><em>搜什么</em></h1>
      <p class="lede" id="capSummary">
        拉取 Google Trends 各地区实时热搜词，并标出 AI 相关词。
      </p>
      <div class="stats" id="stats">
        <div class="stat"><strong id="statRegions">0</strong><span>可用地区</span></div>
        <div class="stat"><strong id="statTerms">0</strong><span>合并热词</span></div>
        <div class="stat"><strong id="statAi">0</strong><span>AI 相关</span></div>
        <div class="stat"><strong id="statGeo">—</strong><span>当前地区</span></div>
      </div>
    </section>

    <section class="tabs-wrap">
      <div class="tabs" id="geoTabs" role="tablist"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2 id="listTitle">热搜词</h2>
        <p id="listNote">按地区展示 Google Trends RSS 热搜</p>
      </div>
      <div class="list" id="trendList"></div>
    </section>
  </main>

  <footer class="foot">
    <span>数据源 · Google Trends RSS · <code>data/trends/latest.json</code></span>
    <span id="note"></span>
  </footer>

  <script src="/assets/trends.js"></script>
</body>
</html>
